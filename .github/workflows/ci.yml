name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
  deps-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
  image:
    needs: [test, deps-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: devsecops-tp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vérifier le conteneur
        env:
          IMAGE: devsecops-tp:${{ github.sha }}
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = node
          docker run --rm "$IMAGE" sh -c 'test ! -d /app/.git && test ! -f /app/.env && test ! -d /app/node_modules/jest && test ! -d /usr/local/lib/node_modules/npm && command -v ping'
          docker run -d --name api-test -p 127.0.0.1:3000:3000 "$IMAGE"
          trap 'docker logs api-test; docker rm -f api-test' EXIT
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-connrefused --retry-delay 1 --max-time 3 --retry-max-time 30 http://127.0.0.1:3000/health | grep '"status":"ok"'
          curl --fail --silent --show-error 'http://127.0.0.1:3000/ping?host=127.0.0.1' | grep '1 packets received'
      - name: Mesurer les couches
        env:
          IMAGE: devsecops-tp:${{ github.sha }}
        run: |
          mkdir -p /tmp/mesures
          docker image inspect "$IMAGE" > /tmp/mesures/image.json
          docker history --no-trunc "$IMAGE" > /tmp/mesures/history.txt
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: devsecops-tp:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          format: json
          output: /tmp/mesures/trivy.json
          exit-code: '0'
      - run: python3 scripts/image-metrics.py /tmp/mesures
      - name: Bloquer les failles corrigeables
        env:
          IMAGE: devsecops-tp:${{ github.sha }}
        run: trivy image --cache-dir .cache/trivy --scanners vuln --skip-db-update --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mesures-image-${{ github.run_id }}
          path: /tmp/mesures/
          if-no-files-found: warn
