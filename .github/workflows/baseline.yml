name: Mesure initiale
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  mesure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t devsecops-tp:naif .
      - name: Mesurer les couches
        run: |
          mkdir -p /tmp/mesures
          docker image inspect devsecops-tp:naif > /tmp/mesures/image-naive.json
          docker history --no-trunc devsecops-tp:naif | tee /tmp/mesures/history-naive.txt
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: devsecops-tp:naif
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: /tmp/mesures/trivy-naive.json
          exit-code: '0'
      - name: Afficher les mesures
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          i = json.loads(Path('/tmp/mesures/image-naive.json').read_text())[0]
          t = json.loads(Path('/tmp/mesures/trivy-naive.json').read_text())
          c = Counter(v['Severity'] for r in t.get('Results', []) for v in r.get('Vulnerabilities', []))
          print('MESURES_JSON=' + json.dumps({'image': 'naive', 'bytes': i['Size'], 'layers': len(i['RootFS']['Layers']), 'high': c['HIGH'], 'critical': c['CRITICAL'], 'base': 'node:22', 'image_id': i['Id']}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mesures-initiales
          path: /tmp/mesures/
