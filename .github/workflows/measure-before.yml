name: Preuve CodeQL initiale
on:
  pull_request:
    types: [opened]
    paths: ['.github/workflows/measure-before.yml']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dd462b6d283cd70f0a5e5bb937f3c8fb065468e3
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          upload: false
          output: /tmp/codeql-before
      - name: Afficher les alertes initiales
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          alerts = []
          for p in Path('/tmp/codeql-before').glob('*.sarif'):
              for run in json.loads(p.read_text())['runs']:
                  rules = {r['id']: r for r in run['tool']['driver']['rules']}
                  for result in run.get('results', []):
                      rule = rules[result['ruleId']]
                      if 'security-severity' in rule.get('properties', {}):
                          loc = result['locations'][0]['physicalLocation']
                          alerts.append({'rule': result['ruleId'], 'file': loc['artifactLocation']['uri'], 'line': loc['region']['startLine'], 'severity': rule['properties']['security-severity']})
          print('CODEQL_BEFORE_JSON=' + json.dumps(alerts))
          Path('/tmp/codeql-before/summary.json').write_text(json.dumps(alerts, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: codeql-avant
          path: /tmp/codeql-before/
