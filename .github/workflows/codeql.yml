name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          output: /tmp/codeql-results
      - name: Vérifier les résultats de sécurité
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          alerts = []
          files = list(Path('/tmp/codeql-results').glob('*.sarif'))
          if not files:
              raise SystemExit('Rapport SARIF absent')
          for p in files:
              for run in json.loads(p.read_text())['runs']:
                  components = [run['tool']['driver'], *run['tool'].get('extensions', [])]
                  rules = {r['id']: r for component in components for r in component.get('rules', [])}
                  for result in run.get('results', []):
                      rule = rules[result['ruleId']]
                      if 'security-severity' in rule.get('properties', {}):
                          loc = result['locations'][0]['physicalLocation']
                          alerts.append({'rule': result['ruleId'], 'file': loc['artifactLocation']['uri'], 'line': loc['region']['startLine'], 'severity': rule['properties']['security-severity']})
          print('CODEQL_JSON=' + json.dumps(alerts))
          if alerts:
              raise SystemExit('Des alertes de sécurité CodeQL restent à corriger')
          PY
